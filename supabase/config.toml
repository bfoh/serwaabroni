project_id = "qumttowvyujqaubyshjq"

# Client-invoked: the gateway JWT check is disabled because this project uses the
# newer asymmetric JWT signing keys, which the edge gateway's verify_jwt cannot
# validate for user tokens (it rejects them before the function runs). The
# function authenticates the caller itself via getUser(), so this stays secure.
[functions.send-notification]
verify_jwt = false

# Client-invoked: super-admin only. Re-verifies the caller (getUser + super_admins)
# inside the function, so the gateway JWT check is not needed.
[functions.admin-impersonate]
verify_jwt = false

# Cron-invoked from pg_cron: no user JWT. Guarded by the X-Cron-Secret header instead.
[functions.daily-tasks]
verify_jwt = false

# Client-invoked: the SerwaaBroni agent proxy. Same asymmetric-JWT reason as above —
# the function validates the caller's token via getUser() itself, so the gateway
# JWT check is disabled.
[functions.serwaa-agent]
verify_jwt = false

# Client-invoked: reads a stock-list photo with Claude vision. The function
# validates the user token in the body, so the gateway JWT check is disabled.
[functions.serwaa-stock-vision]
verify_jwt = false

# Client-invoked: reads a sales-log photo with Claude vision. The function
# validates the user token in the body, so the gateway JWT check is disabled.
[functions.serwaa-sales-vision]
verify_jwt = false

# Client-invoked: an owner invites a Manager/Staff member. Re-verifies the
# caller (getUser + business_profiles ownership) inside the function, so the
# gateway JWT check is not needed. Same asymmetric-JWT reason as admin-impersonate.
[functions.invite-staff]
verify_jwt = false
